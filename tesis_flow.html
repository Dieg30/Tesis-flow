<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b9b4ff;outline-offset:1px}.app{min-height:100vh}.sidebar{width:248px;background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column;padding:22px 14px;transition:transform .2s}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 25px}.brand-mark{background:var(--primary);color:#fff;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:800}.brand strong{display:block;font-size:16px;letter-spacing:.2px}.brand small{color:var(--muted);font-size:11px}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#9aa1b1;padding:10px 12px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#687085;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:11px;align-items:center;font-weight:600}.nav button:hover{background:#f5f5fb;color:var(--text)}.nav button.active{background:var(--primary-soft);color:var(--primary)}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px 0}.project-mini{background:#f7f8fc;border:1px solid var(--line);border-radius:12px;padding:12px}.project-mini small{display:block;color:var(--muted);margin-bottom:5px}.project-mini strong{display:block;font-size:12px;line-height:1.4}.main{margin-left:248px;min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10;gap:16px}.top-left{display:flex;align-items:center;gap:12px;min-width:0}.crumb{font-size:12px;color:var(--muted)}.top-project{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.top-actions{display:flex;gap:8px;align-items:center}.search{width:min(230px,24vw);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfe}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:#616a7d}.avatar{width:35px;height:35px;border-radius:50%;background:#e9e7ff;color:var(--primary);display:grid;place-items:center;font-weight:800}.content{padding:30px 32px 48px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}.eyebrow{color:var(--primary);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.page-head h1{font-size:27px;line-height:1.2;margin:5px 0 7px;letter-spacing:-.7px}.page-head p{color:var(--muted);margin:0;max-width:690px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{background:#f8f8fc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:#4338ca}.btn.danger{color:var(--red);border-color:#ffd3d7}.btn.small{padding:6px 9px;font-size:12px;border-radius:8px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:19px;min-width:0}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:650;font-size:12px}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-size:17px}.stat-value{font-size:30px;font-weight:800;letter-spacing:-1px;margin:12px 0 4px}.stat-note{font-size:12px;color:var(--muted)}.progress{height:7px;border-radius:99px;background:#edf0f5;overflow:hidden}.progress span{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .25s}.progress.green span{background:var(--green)}.dash-grid{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.card-head h2,.section-title{font-size:15px;margin:0;font-weight:800}.sub{font-size:12px;color:var(--muted)}.phase-row{margin:18px 0}.phase-row .rowline{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:12px}.phase-row strong{font-size:12px}.empty{padding:32px 16px;text-align:center;color:var(--muted)}.empty .empty-icon{font-size:28px;margin-bottom:8px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.data-table{border-collapse:collapse;width:100%;min-width:720px;text-align:left}.data-table th{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#8a91a2;background:#fafbfe;font-weight:800}.data-table th,.data-table td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.data-table td{font-size:12px}.data-table tbody tr:hover{background:#fcfcff}.title-cell{font-weight:750;color:var(--text);font-size:13px}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800;white-space:nowrap;background:#f0f2f7;color:#60697c}.badge.green{background:var(--green-soft);color:var(--green)}.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.red{background:var(--red-soft);color:var(--red)}.badge.purple{background:var(--primary-soft);color:var(--primary)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#51596d}.field input,.field select,.field textarea,.filters input,.filters select{width:100%;border:1px solid #dfe3ec;border-radius:9px;padding:10px 11px;background:#fff;color:var(--text);min-width:0}.field textarea{resize:vertical;min-height:86px}.filters input,.filters select{width:auto;min-width:150px;padding:9px 10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.help{font-size:11px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:rgba(20,25,43,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:17px;box-shadow:0 24px 80px #15182c40}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:18px;margin:0}.modal-body{padding:22px}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close{border:0;background:transparent;font-size:23px;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#202536;color:white;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);z-index:80;max-width:340px;display:none}.toast.show{display:block;animation:fade .2s}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto;align-items:start}.kan-col{background:#eff1f7;border-radius:12px;padding:10px;min-height:220px}.kan-head{display:flex;justify-content:space-between;align-items:center;padding:5px 5px 12px;font-size:12px;font-weight:800}.kan-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;box-shadow:0 2px 5px #1b24400a}.kan-card strong{display:block;margin:8px 0;font-size:12px}.kan-actions{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:12px}.mini-select{max-width:135px;padding:6px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:11px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.cal-dayname{padding:10px 4px;text-align:center;color:var(--muted);font-size:10px;font-weight:800}.cal-cell{background:#fff;min-height:105px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;min-width:0}.cal-cell.other{background:#fafbfe;color:#a3a9b7}.cal-num{font-size:11px;font-weight:800}.cal-event{display:block;margin-top:5px;padding:4px 5px;border-radius:5px;background:var(--primary-soft);color:var(--primary);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:11px 13px;font-weight:750;white-space:nowrap;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-color:var(--primary)}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row strong{display:block;font-size:13px}.setting-row p{margin:4px 0 0;color:var(--muted);font-size:12px}.mobile-menu{display:none}.footer-note{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}.task-progress{display:flex;align-items:center;gap:8px;min-width:95px}.task-progress .progress{width:60px}.link-btn{border:0;background:none;color:var(--primary);font-weight:750;padding:4px}.two-col{grid-template-columns:1fr 1fr}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:auto}.hidden{display:none!important}
@media(max-width:1100px){.sidebar{width:220px}.main{margin-left:220px}.content{padding:24px 20px}.topbar{padding:0 20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-grid{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);width:260px;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{height:62px;padding:0 13px}.content{padding:22px 13px 35px}.mobile-menu{display:inline-grid}.search{display:none}.top-project{max-width:155px;font-size:11px}.page-head{display:block}.page-head .actions{margin-top:15px}.page-head h1{font-size:24px}.stats{gap:10px}.card{padding:15px}.stat-value{font-size:25px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.calendar-grid{min-width:620px}.calendar-scroll{overflow:auto}.cal-cell{min-height:80px}.modal-backdrop{padding:10px}.modal-body{padding:16px}.modal-head,.modal-foot{padding:15px 16px}.top-actions{gap:5px}.two-col{grid-template-columns:1fr}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">T</div><div><strong>TESIS FLOW</strong><small>Tu proyecto, en progreso</small></div></div>
  <div class="nav-label">ESPACIO DE TRABAJO</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Panel principal</button>
    <button data-page="project"><span class="ico">◈</span>Mi tesis</button>
    <button data-page="deliverables"><span class="ico">▤</span>Capítulos y entregables</button>
    <button data-page="tasks"><span class="ico">☑</span>Tareas</button>
    <button data-page="timeline"><span class="ico">⇢</span>Cronograma</button>
    <button data-page="calendar"><span class="ico">▦</span>Calendario</button>
    <button data-page="sources"><span class="ico">▧</span>Investigación y fuentes</button>
    <button data-page="audiovisual"><span class="ico">▶</span>Producción audiovisual</button>
    <button data-page="reviews"><span class="ico">☷</span>Revisiones del tutor</button>
    <button data-page="evidence"><span class="ico">▣</span>Archivos y evidencias</button>
    <button data-page="reports"><span class="ico">⌁</span>Informes y estadísticas</button>
  </nav>
  <div class="sidebar-bottom">
    <div class="nav"><button data-page="settings"><span class="ico">⚙</span>Configuración</button></div>
    <div class="project-mini"><small>PROYECTO ACTIVO</small><strong id="sideProject">Sin proyecto creado</strong><div class="progress" style="margin-top:10px"><span id="sideProgress" style="width:0%"></span></div></div>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-left"><button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Abrir menú">☰</button><div><div class="crumb">Espacio de trabajo / <span id="crumb">Panel principal</span></div><button class="top-project" id="projectSwitch">＋ Crear o seleccionar tesis</button></div></div>
  <div class="top-actions"><input id="globalSearch" class="search" placeholder="Buscar en tu tesis…"><button class="icon-btn" id="notifBtn" title="Ver tareas pendientes">♧</button><div class="avatar" id="avatar">A</div></div>
</header>

</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal"><div class="modal-head"><h2 id="modalTitle">Nuevo registro</h2><button class="close" id="modalClose" aria-label="Cerrar">×</button></div><form id="modalForm"><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button type="button" class="btn" id="modalCancel">Cancelar</button><button type="submit" class="btn primary" id="modalSave">Guardar</button></div></form></div>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(() => {
'use strict';
const KEY='tesisFlowData_v1';
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateFmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';
const dateInput=d=>d||'';
const statusLabels={pending:'Pendiente',progress:'En proceso',review:'En revisión',corrections:'Requiere correcciones',done:'Completada',approved:'Aprobado',accepted:'Aceptado',corrected:'Corregido, pendiente de validar',notaccepted:'No aceptado'};
const statusClass=s=>({done:'green',approved:'green',accepted:'green',progress:'purple',review:'amber',corrections:'red',pending:'',corrected:'amber',notaccepted:'red'}[s]||'');
const taskStatuses=['pending','progress','review','done'];
const phasesDefault=[
 {name:'Investigación y fundamentación',weight:25},
 {name:'Metodología y planificación',weight:20},
 {name:'Producción / aplicación',weight:30},
 {name:'Validación y entrega',weight:25}
];
let db=loadDB(),page='dashboard',modalSaveFn=null,editingId=null,searchTerm='',calMonth=new Date().getMonth(),calYear=new Date().getFullYear(),avTab='preproduction';
function blankDB(){return {version:1,activeProjectId:null,projects:[],phases:[],deliverables:[],tasks:[],sources:[],events:[],reviews:[],evidence:[],avrecords:[],activity:[],settings:{theme:'light',reminders:true}}}
function loadDB(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);return {...blankDB(),...d}}}catch(e){}return blankDB()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));$('#saveStatus')&&($('#saveStatus').textContent='Guardado localmente');}catch(e){toast('No se pudo guardar. Exporta una copia de seguridad e intenta reducir los archivos adjuntos.');}}
function logActivity(text){db.activity.unshift({id:uid(),text,date:new Date().toISOString()});db.activity=db.activity.slice(0,60);save()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2800)}
function activeProject(){return db.projects.find(p=>p.id===db.activeProjectId)||null}
function projectRecords(key){const p=activeProject();return db[key].filter(x=>x.projectId===p?.id)}
function pct(n){return Math.round(Number(n)||0)+'%'}
function taskPct(t){if(t.status==='done')return 100;if(t.status==='pending')return 0;return Math.min(99,Math.max(1,Number(t.progress)||25))}
function deliverablePct(d){const ts=projectRecords('tasks').filter(t=>t.deliverableId===d.id);if(!ts.length)return Math.max(0,Math.min(100,Number(d.manualProgress)||0));let total=0,weights=0;ts.forEach(t=>{let w=Math.max(1,Number(t.weight)||1);total+=taskPct(t)*w;weights+=w});return weights?Math.round(total/weights):0}
function phasePct(ph){const ds=projectRecords('deliverables').filter(d=>d.phaseId===ph.id);if(!ds.length)return Math.max(0,Math.min(100,Number(ph.manualProgress)||0));let total=0,weights=0;ds.forEach(d=>{let w=Math.max(1,Number(d.weight)||1);total+=deliverablePct(d)*w;weights+=w});return weights?Math.round(total/weights):0}
function overall(){const phases=projectRecords('phases');if(!phases.length)return 0;let total=0,weights=0;phases.forEach(p=>{let w=Math.max(0,Number(p.weight)||0);total+=phasePct(p)*w;weights+=w});return weights?Math.round(total/weights):0}
function validatedPct(){const phases=projectRecords('phases');if(!phases.length)return 0;let total=0,weights=0;phases.forEach(p=>{let w=Math.max(0,Number(p.weight)||0);const ds=projectRecords('deliverables').filter(d=>d.phaseId===p.id);let dtotal=0,dw=0;ds.forEach(d=>{let x=Math.max(1,Number(d.weight)||1);dtotal+=(d.status==='approved'?100:0)*x;dw+=x});const dp=dw?dtotal/dw:0;total+=dp*w;weights+=w});return weights?Math.round(total/weights):0}
function dueSoon(){const now=today();return projectRecords('tasks').filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate>=now).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))}
function overdue(){const now=today();return projectRecords('tasks').filter(t=>t.status!=='done'&&t.dueDate&&t.dueDate<now)}
function empty(title,desc,button,action){return `<div class="empty"><div class="empty-icon">✧</div><strong>${esc(title)}</strong><div>${esc(desc)}</div>${button?`<button class="btn primary" style="margin-top:14px" data-action="${action}">${esc(button)}</button>`:''}</div>`}
function btn(text,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${text}</button>`}
function pageHead(kicker,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions}</div></div>`}
function stat(label,value,note,icon,accent=''){return `<div class="card"><div class="stat-top"><span>${esc(label)}</span><span class="stat-icon" ${accent?`style="background:${accent}"`:''}>${icon}</span></div><div class="stat-value">${esc(value)}</div><div class="stat-note">${esc(note)}</div></div>`}
function badge(s){return `<span class="badge ${statusClass(s)}">${esc(statusLabels[s]||s||'Sin estado')}</span>`}
function phaseOptions(selected=''){return projectRecords('phases').map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
function deliverableOptions(selected=''){return projectRecords('deliverables').map(d=>`<option value="${d.id}" ${selected===d.id?'selected':''}>${esc(d.title)}</option>`).join('')}
function taskOptions(selected=''){return projectRecords('tasks').map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}
function allRecordSearch(records,fields){return records.filter(r=>fields.some(f=>String(r[f]||'').toLowerCase().includes(searchTerm.toLowerCase())))}
function render(){
 const p=activeProject();$('#sideProject').textContent=p?.title||'Sin proyecto creado';$('#sideProgress').style.width=overall()+'%';$('#projectSwitch').textContent=p?`▾ ${p.title}`:'＋ Crear o seleccionar tesis';$('#avatar').textContent=(p?.studentName||'A').trim().charAt(0).toUpperCase();
 $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const labels={dashboard:'Panel principal',project:'Mi tesis',deliverables:'Capítulos y entregables',tasks:'Tareas',timeline:'Cronograma',calendar:'Calendario',sources:'Investigación y fuentes',audiovisual:'Producción audiovisual',reviews:'Revisiones del tutor',evidence:'Archivos y evidencias',reports:'Informes y estadísticas',settings:'Configuración'};
 $('#crumb').textContent=labels[page]||page;
 if(!p&&!['settings'].includes(page)){renderWelcome();return}
 const renderers={dashboard:renderDashboard,project:renderProject,deliverables:renderDeliverables,tasks:renderTasks,timeline:renderTimeline,calendar:renderCalendar,sources:renderSources,audiovisual:renderAudiovisual,reviews:renderReviews,evidence:renderEvidence,reports:renderReports,settings:renderSettings};
 $('#content').innerHTML=(renderers[page]||renderDashboard)();
}
function renderWelcome(){const has=db.projects.length;$('#content').innerHTML=`
 <div class="card" style="max-width:760px;margin:7vh auto;padding:clamp(24px,5vw,55px);text-align:center">
 <div class="brand-mark" style="margin:0 auto 20px;width:58px;height:58px;font-size:26px">T</div><div class="eyebrow">TU ESPACIO ACADÉMICO</div><h1 style="font-size:32px;letter-spacing:-1px;margin:10px 0">Tu tesis comienza aquí.</h1><p class="muted" style="max-width:490px;margin:0 auto 24px">Organiza tus ideas, planifica tu trabajo y convierte cada avance en un resultado concreto. Crea tu primer proyecto para comenzar.</p>

function renderDashboard(){
 const p=activeProject(),tasks=projectRecords('tasks'),ds=projectRecords('deliverables'),phs=projectRecords('phases'),soon=dueSoon().slice(0,5),over=overdue();
 const pending=tasks.filter(t=>t.status!=='done').length,done=tasks.filter(t=>t.status==='done').length,approved=ds.filter(d=>d.status==='approved').length;
 const dueText=p?.dueDate?dateFmt(p.dueDate):'No definida';
 let phaseHTML=phs.length?phs.map(ph=>`<div class="phase-row"><div class="rowline"><strong>${esc(ph.name)}</strong><span class="muted">${phasePct(ph)}% · Peso ${ph.weight}%</span></div><div class="progress"><span style="width:${phasePct(ph)}%"></span></div></div>`).join(''):empty('Aún no hay fases','Añade fases para medir el avance por etapa.','Crear fase','new-phase');
 const tasksHTML=tasks.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Tarea</th><th>Fecha límite</th><th>Estado</th><th>Avance</th></tr></thead><tbody>${[...tasks].filter(t=>t.status!=='done').sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')).slice(0,5).map(t=>`<tr><td><div class="title-cell">${esc(t.title)}</div><div class="sub">${esc(ds.find(d=>d.id===t.deliverableId)?.title||'Sin entregable')}</div></td><td>${dateFmt(t.dueDate)}</td><td>${badge(t.status)}</td><td><div class="task-progress"><div class="progress"><span style="width:${taskPct(t)}%"></span></div><span>${taskPct(t)}%</span></div></td></tr>`).join('')}</tbody></table></div>`:empty('No hay tareas todavía','Crea tareas para empezar a medir tu trabajo.','Añadir tarea','new-task');
 const activity=db.activity.filter(a=>!p||a.projectId===p.id).slice(0,5);
 return `${pageHead('VISTA GENERAL','Panel principal',p.title,`<button class="btn" data-action="new-deliverable">＋ Entregable</button><button class="btn primary" data-action="new-task">＋ Añadir tarea</button>`)}
 <div class="grid stats">${stat('Avance general',pct(overall()),'Según fases y entregables','◔')}${stat('Tareas pendientes',pending,`${done} completadas`,'☑')}${stat('Tareas vencidas',over.length,over.length?'Requieren atención':'Sin tareas vencidas', '◷',over.length?'background:#ffeaec;color:#c43d4b':'')}${stat('Entregables aprobados',`${approved} / ${ds.length}`,`${validatedPct()}% de avance validado`,'✓','background:#e5f6ed;color:#168653')}</div>
 <div class="grid dash-grid"><div class="card"><div class="card-head"><div><h2>Avance por fase</h2><div class="sub">Peso de cada fase en tu tesis</div></div><button class="link-btn" data-action="go-project">Ver tesis →</button></div>${phaseHTML}</div><div class="card"><div class="card-head"><div><h2>Próximas fechas</h2><div class="sub">Tus siguientes tareas pendientes</div></div><button class="link-btn" data-action="go-calendar">Calendario →</button></div>${soon.length?soon.map(t=>`<div class="setting-row"><div><strong>${esc(t.title)}</strong><p>${dateFmt(t.dueDate)}</p></div>${badge(t.status)}</div>`).join(''):empty('Todo despejado','No hay fechas próximas registradas.')}</div></div>
 <div class="grid dash-grid" style="margin-top:16px"><div class="card"><div class="card-head"><div><h2>Tareas por completar</h2><div class="sub">Las tareas que siguen abiertas</div></div><button class="link-btn" data-action="go-tasks">Ver todas →</button></div>${tasksHTML}</div><div class="card"><div class="card-head"><div><h2>Actividad reciente</h2><div class="sub">Cambios registrados en la aplicación</div></div></div>${activity.length?activity.map(a=>`<div class="setting-row"><div><strong>${esc(a.text)}</strong><p>${new Date(a.date).toLocaleString('es-EC')}</p></div><span class="badge">Registro</span></div>`).join(''):empty('Aquí aparecerá tu actividad','Crea o actualiza registros para generar un historial.')}</div></div>
 <div class="footer-note">Fecha de entrega estimada: ${dateFmt(p.dueDate)} · <span id="saveStatus">Guardado localmente</span></div>`;
}
function renderProject(){const p=activeProject(),phs=projectRecords('phases');return `${pageHead('INFORMACIÓN DEL PROYECTO','Mi tesis','Administra los datos generales, objetivos, fechas y fases de tu investigación.',`<button class="btn" data-action="new-phase">＋ Añadir fase</button><button class="btn primary" data-action="edit-project">✎ Editar datos</button>`)}
 <div class="grid dash-grid"><div class="card"><div class="eyebrow">PROYECTO ACTIVO</div><h2 style="font-size:22px;margin:8px 0 10px">${esc(p.title)}</h2><p class="muted">${esc(p.description||'Añade una descripción para definir el propósito de tu investigación.')}</p><div class="grid two-col" style="margin-top:20px"><div><div class="sub">Estudiante</div><strong>${esc(p.studentName||'Sin registrar')}</strong></div><div><div class="sub">Tutor</div><strong>${esc(p.tutor||'Sin registrar')}</strong></div><div><div class="sub">Universidad</div><strong>${esc(p.university||'Sin registrar')}</strong></div><div><div class="sub">Carrera</div><strong>${esc(p.degree||'Sin registrar')}</strong></div><div><div class="sub">Inicio</div><strong>${dateFmt(p.startDate)}</strong></div><div><div class="sub">Entrega estimada</div><strong>${dateFmt(p.dueDate)}</strong></div></div><div style="margin-top:22px"><div class="rowline" style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>Avance de ejecución</strong><strong>${overall()}%</strong></div><div class="progress"><span style="width:${overall()}%"></span></div></div></div>
 <div class="card"><h2 class="section-title">Objetivos de investigación</h2><div style="margin-top:16px"><div class="sub">Objetivo general</div><p>${esc(p.generalObjective||'No se ha registrado un objetivo general.')}</p></div><div style="margin-top:18px"><div class="sub">Objetivos específicos</div>${(p.specificObjectives||[]).length?`<ol>${p.specificObjectives.map(x=>`<li style="margin:9px 0">${esc(x)}</li>`).join('')}</ol>`:'<p class="muted">No se han registrado objetivos específicos.</p>'}</div></div></div>
 <div class="card" style="margin-top:16px"><div class="card-head"><div><h2>Fases del proyecto</h2><div class="sub">La suma de pesos debe ser 100 % para reflejar el avance ponderado correctamente.</div></div><span class="badge ${phs.reduce((s,x)=>s+Number(x.weight||0),0)===100?'green':'amber'}">Peso total: ${phs.reduce((s,x)=>s+Number(x.weight||0),0)}%</span></div>
 ${phs.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Fase</th><th>Peso</th><th>Avance</th><th>Fecha límite</th><th>Acciones</th></tr></thead><tbody>${phs.map(ph=>`<tr><td class="title-cell">${esc(ph.name)}</td><td>${ph.weight}%</td><td><div class="task-progress"><div class="progress"><span style="width:${phasePct(ph)}%"></span></div>${phasePct(ph)}%</div></td><td>${dateFmt(ph.dueDate)}</td><td><button class="btn small" data-action="edit-phase" data-id="${ph.id}">Editar</button> <button class="btn small danger" data-action="delete" data-type="phases" data-id="${ph.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:empty('Todavía no hay fases','Añade las fases que estructuran tu tesis.','Añadir fase','new-phase')}</div>`}
function renderDeliverables(){let arr=projectRecords('deliverables');if(searchTerm)arr=allRecordSearch(arr,['title','description']);return `${pageHead('ESTRUCTURA ACADÉMICA','Capítulos y entregables','Desglosa tu tesis en productos verificables y controla su aprobación.',`<button class="btn primary" data-action="new-deliverable">＋ Nuevo entregable</button>`)}
 <div class="filters"><input id="deliverableSearch" placeholder="Buscar entregable…" value="${esc(searchTerm)}"><select id="deliverableStatus"><option value="">Todos los estados</option>${['pending','progress','review','corrections','approved'].map(s=>`<option value="${s}">${statusLabels[s]}</option>`).join('')}</select><select id="deliverablePhase"><option value="">Todas las fases</option>${phaseOptions()}</select></div>
 <div class="card" style="padding:0"><div id="deliverableTable">${deliverableTable(arr)}</div></div>`}
function deliverableTable(arr){return arr.length?`<div class="table-wrap" style="border:0"><table class="data-table"><thead><tr><th>Entregable</th><th>Fase</th><th>Avance</th><th>Estado</th><th>Fecha límite</th><th>Acciones</th></tr></thead><tbody>${arr.map(d=>`<tr><td><div class="title-cell">${esc(d.title)}</div><div class="sub">${esc(d.description||'Sin descripción')}</div></td><td>${esc(projectRecords('phases').find(p=>p.id===d.phaseId)?.name||'Sin fase')}</td><td><div class="task-progress"><div class="progress"><span style="width:${deliverablePct(d)}%"></span></div>${deliverablePct(d)}%</div></td><td>${badge(d.status)}</td><td>${dateFmt(d.dueDate)}</td><td><button class="btn small" data-action="edit-deliverable" data-id="${d.id}">Editar</button> <button class="btn small danger" data-action="delete" data-type="deliverables" data-id="${d.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('No hay entregables','Crea tu primer capítulo o producto académico.','Nuevo entregable','new-deliverable')}
function renderTasks(){let tasks=projectRecords('tasks');if(searchTerm)tasks=allRecordSearch(tasks,['title','description','tags']);return `${pageHead('TRABAJO DIARIO','Tareas','Convierte cada objetivo en acciones concretas, con fechas y prioridades.',`<button class="btn" data-action="toggle-kanban">${window.taskView==='kanban'?'☷ Vista de lista':'▦ Vista Kanban'}</button><button class="btn primary" data-action="new-task">＋ Añadir tarea</button>`)}
 <div class="filters"><input id="taskSearch" placeholder="Buscar tareas…" value="${esc(searchTerm)}"><select id="taskFilterStatus"><option value="">Todos los estados</option>${taskStatuses.map(s=>`<option value="${s}">${statusLabels[s]}</option>`).join('')}</select><select id="taskFilterPriority"><option value="">Todas las prioridades</option>${['urgent','high','medium','low'].map(s=>`<option value="${s}">${({urgent:'Urgente',high:'Alta',medium:'Media',low:'Baja'})[s]}</option>`).join('')}</select><select id="taskFilterPhase"><option value="">Todas las fases</option>${phaseOptions()}</select></div>
 <div id="taskListing">${window.taskView==='kanban'?kanban(tasks):taskTable(tasks)}</div>`}
window.taskView='list';
function taskTable(tasks){return tasks.length?`<div class="card" style="padding:0"><div class="table-wrap" style="border:0"><table class="data-table"><thead><tr><th>Tarea</th><th>Entregable</th><th>Prioridad</th><th>Estado</th><th>Fecha límite</th><th>Progreso</th><th>Acciones</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><div class="title-cell">${esc(t.title)}</div><div class="sub">${esc(t.description||'')}</div></td><td>${esc(projectRecords('deliverables').find(d=>d.id===t.deliverableId)?.title||'Sin asociar')}</td><td>${priorityBadge(t.priority)}</td><td><select class="mini-select" data-task-status="${t.id}">${taskStatuses.map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${statusLabels[s]}</option>`).join('')}</select></td><td>${dateFmt(t.dueDate)} ${t.status!=='done'&&t.dueDate<today()&&t.dueDate?'<span class="badge red">Vencida</span>':''}</td><td><div class="task-progress"><div class="progress"><span style="width:${taskPct(t)}%"></span></div>${taskPct(t)}%</div></td><td><button class="btn small" data-action="edit-task" data-id="${t.id}">Editar</button> <button class="btn small danger" data-action="delete" data-type="tasks" data-id="${t.id}">×</button></td></tr>`).join('')}</tbody></table></div></div>`:empty('No hay tareas','Añade una tarea o ajusta los filtros.','Crear tarea','new-task')}
function priorityBadge(p){return `<span class="badge ${p==='urgent'?'red':p==='high'?'amber':''}">${({urgent:'Urgente',high:'Alta',medium:'Media',low:'Baja'})[p]||'Media'}</span>`}
function kanban(tasks){return `<div class="kanban">${taskStatuses.map(s=>{let list=tasks.filter(t=>t.status===s);return `<div class="kan-col"><div class="kan-head"><span>${statusLabels[s]}</span><span class="badge">${list.length}</span></div>${list.map(t=>`<div class="kan-card"><span class="sub">${esc(projectRecords('deliverables').find(d=>d.id===t.deliverableId)?.title||'Sin entregable')}</span><strong>${esc(t.title)}</strong><div style="display:flex;justify-content:space-between;align-items:center">${priorityBadge(t.priority)}<span class="sub">${dateFmt(t.dueDate)}</span></div><div class="kan-actions"><select class="mini-select" data-task-status="${t.id}">${taskStatuses.map(x=>`<option value="${x}" ${x===s?'selected':''}>Mover a: ${statusLabels[x]}</option>`).join('')}</select><button class="link-btn" data-action="edit-task" data-id="${t.id}">Editar</button></div></div>`).join('')||'<div class="sub" style="padding:10px">Sin tareas</div>'}</div>`}).join('')}</div>`}
function renderTimeline(){const tasks=projectRecords('tasks').filter(t=>t.startDate||t.dueDate).sort((a,b)=>(a.startDate||a.dueDate).localeCompare(b.startDate||b.dueDate));const ds=projectRecords('deliverables');return `${pageHead('PLANIFICACIÓN','Cronograma','Consulta fechas, dependencias y tareas en curso.',`<button class="btn primary" data-action="new-task">＋ Nueva tarea</button>`)}
 <div class="card"><div class="card-head"><div><h2>Plan de trabajo</h2><div class="sub">Vista de línea temporal basada en las fechas registradas</div></div><span class="badge">${tasks.length} tareas con fechas</span></div>${tasks.length?`<div style="display:grid;gap:17px">${tasks.map(t=>`<div><div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:7px"><div><strong>${esc(t.title)}</strong><div class="sub">${dateFmt(t.startDate||t.dueDate)} — ${dateFmt(t.dueDate)}</div></div><div>${badge(t.status)}</div></div><div class="progress"><span style="width:${taskPct(t)}%"></span></div></div>`).join('')}</div>`:empty('No hay tareas planificadas','Añade fechas de inicio o de entrega a tus tareas.','Crear tarea','new-task')}</div>
 <div class="card" style="margin-top:16px"><h2 class="section-title">Hitos de entregables</h2>${ds.length?ds.map(d=>`<div class="setting-row"><div><strong>${esc(d.title)}</strong><p>Fecha límite: ${dateFmt(d.dueDate)}</p></div>${badge(d.status)}</div>`).join(''):empty('Sin hitos','Crea entregables para registrar fechas importantes.')}</div>`}
function renderCalendar(){const p=activeProject();const first=new Date(calYear,calMonth,1),start=new Date(calYear,calMonth,1-first.getDay()),monthName=first.toLocaleDateString('es-EC',{month:'long',year:'numeric'});let cells='';const events=projectRecords('events'),tasks=projectRecords('tasks');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const items=[...events.filter(e=>(e.startDateTime||'').slice(0,10)===key).map(e=>({title:e.title,id:e.id,type:'event'})),...tasks.filter(t=>t.dueDate===key).map(t=>({title:t.title,id:t.id,type:'task'}))];cells+=`<div class="cal-cell ${d.getMonth()!==calMonth?'other':''}"><div class="cal-num">${d.getDate()}${key===today()?' · Hoy':''}</div>${items.map(it=>`<button class="cal-event" title="${esc(it.title)}" data-action="${it.type==='task'?'edit-task':'edit-event'}" data-id="${it.id}">${esc(it.title)}</button>`).join('')}</div>`}
 return `${pageHead('FECHAS IMPORTANTES','Calendario','Organiza entregas, entrevistas, reuniones y jornadas de producción.',`<button class="btn primary" data-action="new-event">＋ Nuevo evento</button>`)}
 <div class="card"><div class="calendar-head"><button class="btn" data-action="prev-month">← Anterior</button><h2 style="margin:0;text-transform:capitalize">${esc(monthName)}</h2><button class="btn" data-action="next-month">Siguiente →</button></div><div class="calendar-scroll"><div class="calendar-grid">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<div class="cal-dayname">${x}</div>`).join('')}${cells}</div></div><div class="sub" style="margin-top:12px">Los eventos y las fechas límite de las tareas se muestran en el calendario.</div></div>`}
function renderSources(){let arr=projectRecords('sources');if(searchTerm)arr=allRecordSearch(arr,['title','authors','notes','type']);return `${pageHead('BIBLIOTECA ACADÉMICA','Investigación y fuentes','Organiza las fuentes consultadas y prepara referencias bibliográficas verificables.',`<button class="btn" data-action="export-bib">⇩ Exportar bibliografía</button><button class="btn primary" data-action="new-source">＋ Añadir fuente</button>`)}
 <div class="filters"><input id="sourceSearch" placeholder="Buscar título, autor o tema…" value="${esc(searchTerm)}"><select id="sourceType"><option value="">Todos los tipos</option>${['Artículo científico','Libro','Tesis','Documento institucional','Sitio web','Entrevista','Archivo histórico','Fotografía documental','Otro'].map(s=>`<option>${s}</option>`).join('')}</select></div>
 <div class="card" style="padding:0"><div id="sourceTable">${sourceTable(arr)}</div></div>`}
function sourceTable(arr){return arr.length?`<div class="table-wrap" style="border:0"><table class="data-table"><thead><tr><th>Fuente</th><th>Tipo</th><th>Año</th><th>Autoría</th><th>Referencia</th><th>Acciones</th></tr></thead><tbody>${arr.map(s=>`<tr><td><div class="title-cell">${esc(s.title)}</div><div class="sub">${esc(s.publisher||s.url||'')}</div></td><td><span class="badge">${esc(s.type)}</span></td><td>${esc(s.year||'—')}</td><td>${esc(s.authors||'—')}</td><td><button class="btn small" data-action="copy-citation" data-id="${s.id}">Copiar APA</button></td><td><button class="btn small" data-action="edit-source" data-id="${s.id}">Editar</button> <button class="btn small danger" data-action="delete" data-type="sources" data-id="${s.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('Tu biblioteca está vacía','Añade la primera fuente que hayas consultado.','Añadir fuente','new-source')}
function apa(s){const author=s.authors?.trim()||'Autor no registrado';const year=s.year?.trim()||'s. f.';let ref=`${author} (${year}). ${s.title||'[Título no registrado]'}.`;if(s.publisher)ref+=` ${s.publisher}.`;if(s.doi)ref+=` https://doi.org/${s.doi.replace(/^https?:\/\/doi.org\//,'')}`;else if(s.url)ref+=` ${s.url}`;return ref}
function renderAudiovisual(){const rows=projectRecords('avrecords');const tabs=[['preproduction','Preproducción'],['interviews','Entrevistas'],['shooting','Plan de rodaje'],['shots','Lista de tomas'],['media','Registro de material'],['postproduction','Postproducción'],['delivery','Entrega audiovisual']];const filtered=rows.filter(r=>r.type===avTab);const titles={preproduction:'Planificación y desarrollo conceptual',interviews:'Registro de entrevistas',shooting:'Plan de rodaje',shots:'Lista de tomas',media:'Inventario audiovisual',postproduction:'Flujo de postproducción',delivery:'Versiones y entrega final'};return `${pageHead('PRODUCCIÓN DEL PRODUCTO','Producción audiovisual','Organiza las etapas de producción de tu documental u otro producto aplicado.',`<button class="btn primary" data-action="new-avrecord">＋ Nuevo registro</button>`)}

 ${filtered.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Registro</th><th>Fecha</th><th>Estado</th><th>Archivo / ubicación</th><th>Acciones</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><div class="title-cell">${esc(r.title)}</div><div class="sub">${esc(r.description||'')}</div></td><td>${dateFmt(r.date)}</td><td>${badge(r.status||'pending')}</td><td>${r.fileReference?`<a href="${esc(r.fileReference)}" target="_blank" rel="noopener noreferrer">Abrir enlace ↗</a>`:'—'}</td><td><button class="btn small" data-action="edit-avrecord" data-id="${r.id}">Editar</button> <button class="btn small danger" data-action="delete" data-type="avrecords" data-id="${r.id}">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('Sin registros en esta etapa','Añade entrevistas, escenas, tomas o actividades para documentar tu proceso.','Añadir registro','new-avrecord')}
 <div class="help" style="margin-top:15px">Este módulo organiza registros y enlaces. La edición de video se realiza en una herramienta audiovisual externa.</div></div>`}
function renderReviews(){const arr=projectRecords('reviews');return `${pageHead('CONTROL DE CALIDAD','Revisiones del tutor','Registra observaciones, correcciones y aprobaciones explícitas.',`<button class="btn primary" data-action="new-review">＋ Registrar revisión</button>`)}

function openModal(title,fields,initial={},onSave,saveText='Guardar'){
 $('#modalTitle').textContent=title;$('#modalBody').innerHTML=fields.map(f=>fieldHTML(f,initial[f.name])).join('');$('#modalSave').textContent=saveText;$('#modalBackdrop').classList.add('show');modalSaveFn=onSave;editingId=initial.id||null;
 setTimeout(()=>$('#modalBody input:not([type=hidden]),#modalBody select,#modalBody textarea')?.focus(),50);
}
function fieldHTML(f,value){
 const v=value??f.default??'';let control='';
 if(f.type==='textarea')control=`<textarea name="${f.name}" ${f.required?'required':''} rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}">${esc(Array.isArray(v)?v.join('\n'):v)}</textarea>`;
 else if(f.type==='select')control=`<select name="${f.name}" ${f.required?'required':''}>${(f.options||[]).map(o=>{let val=typeof o==='string'?o:o.value,label=typeof o==='string'?o:o.label;return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(label)}</option>`}).join('')}</select>`;
 else if(f.type==='checkbox')control=`<label class="checkline"><input type="checkbox" name="${f.name}" ${v?'checked':''}> ${esc(f.labelText||'Sí')}</label>`;
 else if(f.type==='objectives')control=`<textarea name="${f.name}" rows="4" placeholder="Escribe un objetivo por línea">${esc(Array.isArray(v)?v.join('\n'):v)}</textarea><div class="help">Escribe un objetivo por línea.</div>`;
 else control=`<input name="${f.name}" type="${f.type||'text'}" value="${esc(v)}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} ${f.step?`step="${f.step}"`:''} placeholder="${esc(f.placeholder||'')}">`;
 return `<div class="field ${f.full?'full':''}"><label>${esc(f.label)}${f.required?' *':''}</label>${control}${f.help?`<div class="help">${esc(f.help)}</div>`:''}</div>`;
}
function closeModal(){$('#modalBackdrop').classList.remove('show');modalSaveFn=null;editingId=null}

function exportJSON(){const data={...db,exportedAt:new Date().toISOString(),format:'TESIS_FLOW_BACKUP'};downloadBlob(JSON.stringify(data,null,2),'tesis-flow-copia-'+today()+'.json','application/json');toast('Copia de seguridad exportada')}
function downloadBlob(text,name,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const tasks=projectRecords('tasks');const cols=['title','description','status','priority','startDate','dueDate','progress','estimatedMinutes','actualMinutes'];const csv=[cols.join(','),...tasks.map(t=>cols.map(k=>`"${String(t[k]??'').replace(/"/g,'""')}"`).join(','))].join('\r\n');downloadBlob('\ufeff'+csv,'tesis-flow-tareas-'+today()+'.csv','text/csv;charset=utf-8');toast('CSV exportado')}
function exportBib(){const text=projectRecords('sources').map(apa).join('\n\n');downloadBlob(text,'bibliografia-tesis.txt','text/plain;charset=utf-8');toast('Bibliografía exportada')}
function importBackup(){ $('#importFile').click()}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||!Array.isArray(obj.projects)||!Array.isArray(obj.tasks))throw new Error('Formato no válido');if(!confirm('¿Quieres combinar los registros de esta copia con los actuales? Los identificadores duplicados se omitirán.'))return;const collections=['projects','phases','deliverables','tasks','sources','events','reviews','evidence','avrecords','activity'];collections.forEach(k=>{if(Array.isArray(obj[k])){const seen=new Set(db[k].map(x=>x.id));obj[k].forEach(x=>{if(x.id&&!seen.has(x.id)){db[k].push(x);seen.add(x.id)}})}});if(!db.activeProjectId&&obj.activeProjectId)db.activeProjectId=obj.activeProjectId;save();render();toast('Copia importada. Se combinaron los registros nuevos.')}catch(e){toast('El archivo no parece ser una copia válida de TESIS FLOW.')}};reader.readAsText(file)}
function chooseProject(){if(!db.projects.length){projectForm();return}const options=db.projects.map(p=>({value:p.id,label:p.title}));openModal('Seleccionar proyecto',[{name:'projectId',label:'Proyecto activo',type:'select',options,required:true}],{projectId:db.activeProjectId},v=>{db.activeProjectId=v.projectId;save();closeModal();page='dashboard';render();toast('Proyecto cambiado')},'Seleccionar')}
function action(action,id,el){
 const p=activeProject();
 switch(action){
 case 'new-project':projectForm();break;case 'edit-project':if(p)projectForm(p);break;case 'choose-project':chooseProject();break;case 'new-phase':phaseForm();break;case 'edit-phase':phaseForm(db.phases.find(x=>x.id===id));break;
 case 'new-deliverable':deliverableForm();break;case 'edit-deliverable':deliverableForm(db.deliverables.find(x=>x.id===id));break;case 'new-task':taskForm();break;case 'edit-task':taskForm(db.tasks.find(x=>x.id===id));break;
 case 'new-source':sourceForm();break;case 'edit-source':sourceForm(db.sources.find(x=>x.id===id));break;case 'new-event':eventForm();break;case 'edit-event':eventForm(db.events.find(x=>x.id===id));break;
 case 'new-review':reviewForm();break;case 'edit-review':reviewForm(db.reviews.find(x=>x.id===id));break;case 'new-avrecord':avForm();break;case 'edit-avrecord':avForm(db.avrecords.find(x=>x.id===id));break;case 'new-evidence':evidenceForm();break;case 'edit-evidence':evidenceForm(db.evidence.find(x=>x.id===id));break;
 case 'delete':deleteRecord(el.dataset.type,id);break;case 'export':exportJSON();break;case 'import':importBackup();break;case 'export-csv':exportCSV();break;case 'export-bib':exportBib();break;
 case 'reset':if(confirm('¿Eliminar TODOS los proyectos y registros guardados en este navegador? Exporta una copia antes si la necesitas.')){db=blankDB();save();page='dashboard';render();toast('Datos restablecidos')}break;
 case 'toggle-kanban':window.taskView=window.taskView==='kanban'?'list':'kanban';render();break;
 case 'go-project':page='project';render();break;case 'go-calendar':page='calendar';render();break;case 'go-tasks':page='tasks';render();break;
 case 'prev-month':calMonth--;if(calMonth<0){calMonth=11;calYear--}render();break;case 'next-month':calMonth++;if(calMonth>11){calMonth=0;calYear++}render();break;
 case 'av-tab':avTab=el.dataset.tab;render();break;
 case 'copy-citation':{const s=db.sources.find(x=>x.id===id);if(s){navigator.clipboard?.writeText(apa(s)).then(()=>toast('Referencia copiada')).catch(()=>{prompt('Copia la referencia APA:',apa(s))})}break}
 case 'help':toast('Empieza creando una tesis, configura sus fases y añade entregables y tareas. Exporta copias de seguridad periódicamente.');break;
 }
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;searchTerm='';$('#sidebar').classList.remove('open');render()});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;action(b.dataset.action,b.dataset.id,b)});
$('#modalClose').addEventListener('click',closeModal);$('#modalCancel').addEventListener('click',closeModal);
$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();if(!modalSaveFn)return;const v=formValues(e.currentTarget);modalSaveFn(v)});
$('#projectSwitch').addEventListener('click',chooseProject);
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#notifBtn').addEventListener('click',()=>{const n=overdue().length;toast(n?`Tienes ${n} tarea(s) vencida(s). Revisa la sección Tareas.`:'No tienes tareas vencidas.')});
$('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.trim();if(!searchTerm)return;const routes=[['tasks',db.tasks,['title','description']],['deliverables',db.deliverables,['title','description']],['sources',db.sources,['title','authors']],['reviews',db.reviews,['comment','requestedCorrection']],['avrecords',db.avrecords,['title','description']]];const match=routes.find(([k,arr,fields])=>arr.some(r=>r.projectId===activeProject()?.id&&fields.some(f=>String(r[f]||'').toLowerCase().includes(searchTerm.toLowerCase()))));if(match){page=({tasks:'tasks',deliverables:'deliverables',sources:'sources',reviews:'reviews',avrecords:'audiovisual'})[match[0]];if(match[0]==='avrecords')avTab=match[1].find(r=>r.projectId===activeProject()?.id&&String(r.title||'').toLowerCase().includes(searchTerm.toLowerCase()))?.type||'preproduction';render()}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importData(f);e.target.value=''});
$('#content').addEventListener('input',e=>{if(e.target.id==='taskSearch'||e.target.id==='deliverableSearch'||e.target.id==='sourceSearch'){searchTerm=e.target.value;const val=searchTerm;const selection=e.target.id;const pos=e.target.selectionStart;render();const newInput=$('#'+selection);if(newInput){newInput.focus();newInput.setSelectionRange(pos,pos)}if(selection==='taskSearch')$('#taskListing').innerHTML=window.taskView==='kanban'?kanban(allRecordSearch(projectRecords('tasks'),['title','description','tags'])):taskTable(allRecordSearch(projectRecords('tasks'),['title','description','tags']));if(selection==='deliverableSearch')$('#deliverableTable').innerHTML=deliverableTable(allRecordSearch(projectRecords('deliverables'),['title','description']));if(selection==='sourceSearch')$('#sourceTable').innerHTML=sourceTable(allRecordSearch(projectRecords('sources'),['title','authors','notes','type']))}});
$('#content').addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-task-status]')){const task=db.tasks.find(x=>x.id===t.dataset.taskStatus);if(task){task.status=t.value;task.progress=t.value==='done'?100:t.value==='pending'?0:Math.min(99,Math.max(1,task.progress||25));task.updatedAt=new Date().toISOString();logActivity('Actualizó el estado de una tarea');save();render();toast('Estado actualizado')}}
 if(t.matches('[data-review-status]')){const r=db.reviews.find(x=>x.id===t.dataset.reviewStatus);if(r){r.status=t.value;if(t.value==='accepted'&&r.deliverableId){const d=db.deliverables.find(x=>x.id===r.deliverableId);if(d){d.status='approved';d.approvedAt=new Date().toISOString()}}logActivity('Actualizó el estado de una revisión');save();render();toast('Revisión actualizada')}}
 if(t.id==='taskFilterStatus'||t.id==='taskFilterPriority'||t.id==='taskFilterPhase'){let arr=projectRecords('tasks');if($('#taskFilterStatus')?.value)arr=arr.filter(x=>x.status===$('#taskFilterStatus').value);if($('#taskFilterPriority')?.value)arr=arr.filter(x=>x.priority===$('#taskFilterPriority').value);if($('#taskFilterPhase')?.value){const ds=projectRecords('deliverables').filter(d=>d.phaseId===$('#taskFilterPhase').value).map(d=>d.id);arr=arr.filter(x=>ds.includes(x.deliverableId))}if(searchTerm)arr=allRecordSearch(arr,['title','description','tags']);$('#taskListing').innerHTML=window.taskView==='kanban'?kanban(arr):taskTable(arr)}
 if(t.id==='deliverableStatus'||t.id==='deliverablePhase'){let arr=projectRecords('deliverables');if($('#deliverableStatus')?.value)arr=arr.filter(x=>x.status===$('#deliverableStatus').value);if($('#deliverablePhase')?.value)arr=arr.filter(x=>x.phaseId===$('#deliverablePhase').value);if(searchTerm)arr=allRecordSearch(arr,['title','description']);$('#deliverableTable').innerHTML=deliverableTable(arr)}
 if(t.id==='sourceType'){let arr=projectRecords('sources');if(t.value)arr=arr.filter(x=>x.type===t.value);if(searchTerm)arr=allRecordSearch(arr,['title','authors','notes','type']);$('#sourceTable').innerHTML=sourceTable(arr)}
 if(t.id==='reviewStatus'){let arr=projectRecords('reviews');if(t.value)arr=arr.filter(x=>x.status===t.value);$('#reviewTable').innerHTML=reviewTable(arr)}
});
window.addEventListener('storage',()=>{db=loadDB();render()});
render();
})();
</script>
</body>
